   <text style="font-size: 11.5px; font-family: 'Apple SD Gothic Neo'; fill: #59677a" transform="translate(63.36 612.647969)">목적표본의 구성 비교이며 전 산업 비중이 아님. 0은 이 항에서 미확인이라는 뜻; 특허 전체의 기능 부재를 뜻하지 않음.</text>
