  <g id="text_26">
   <text style="font-size: 16px; font-family: 'Noto Sans CJK KR', 'Noto Sans CJK JP'; text-anchor: start; fill: #59677a" x="63.36" y="108.04" transform="rotate(-0 63.36 108.04)">V2 핵심특허(연도층별 연평균 피인용 상위) · 막대 = 기능을 명시한 특허 수 (기술별 10건 중)</text>
