  <g id="text_34">
   <text style="font-size: 11.5px; font-family: 'Noto Sans CJK KR', 'Noto Sans CJK JP'; fill: #59677a" transform="translate(63.36 596.323359)">출처: 미국 등록공보 독립항 1(새 14건 Google Patents 확인 2026.11.20, V1 6건은 11.17 코딩 유지). 기능 중복 코딩.</text>
   <text style="font-size: 11.5px; font-family: 'Noto Sans CJK KR', 'Noto Sans CJK JP'; fill: #59677a" transform="translate(63.36 613.98125)">목적표본의 구성 비교이며 전 산업 비중이 아님. 0은 이 항에서 미확인이라는 뜻. 행별 근거: data/v2/results/US_claim1_review_v2.csv</text>
